name: Verify all family photos are live and byte-identical on GitHub Pages
# 2026-11-04 Acanthaceae: verify 48 new originals with Kew-supported name checks; preserve all 624 public Lamiales photos and photographer/license credits.
# Preserve owner-granted public-display-only rights flags; these are not commercial reuse licenses.
# 2026-11-03 Balsaminaceae–Bixaceae: verify new licensed originals (all current 475 gallery photos), source credits and exact public image bytes.
# 2026-11-03 Lamiaceae: automatically verify new gallery originals and attribution after source-cleared publication.
# 2026-11-03 t.zip: verify four new Utricularia gibba original photos and attributed Lamiales gallery.
# 2026-11-03 audit all new credited Oleaceae and Martyniaceae originals visible on live public family Pages.
# 2026-11-03 verify source-cleared Ophioglossaceae–Orobanchaceae photos, exact live image bytes and attribution.
# This follow-up audits the full gallery after newly published fern and Orobanchaceae originals.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-multifamily-published-photos-2026-11-02.yml'
      - 'site/media/**'
      - 'site/data/species/**'
      - 'site/data/gallery-index.json'
      - 'site/data/collection-index.json'
      - 'site/data/reviewed-external-photo-manifest.json'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  live-photo-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify the exact published website photo bytes and license records
        run: |
          python3 - <<'PY'
          import concurrent.futures,hashlib,json,time,urllib.request,urllib.error
          from pathlib import Path
          site=Path("site")
          meta=json.loads((site/"data/collection-meta.json").read_text())
          catalog=json.loads((site/"data/collection-index.json").read_text())
          gal=json.loads((site/"data/gallery-index.json").read_text())
          base="https://crking92.github.io/"+meta["repository_full_name"].split("/")[-1]+"/site/"
          def retrieve(rel,cache=""):
              url=base+rel+cache
              req=urllib.request.Request(url,headers={"User-Agent":"HaysBotanyLiveOriginalPhotoAudit/1.0"})
              # GitHub Pages occasionally returns 429/502/503/504 mid-deployment.
              # Retry only transient statuses, preserving exact-byte validation.
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(req,timeout=28) as response:
                          if response.status!=200: raise ValueError("Bad live HTTP status: "+url)
                          return response.read()
                  except urllib.error.HTTPError as e:
                      if e.code not in (429,502,503,504) or attempt==5:raise
                      time.sleep(min(2+2*attempt,12))
                  except (TimeoutError,ConnectionError,urllib.error.URLError):
                      if attempt==5:raise
                      time.sleep(min(2+2*attempt,12))
          expected=(site/"data/gallery-index.json").read_bytes()
          for retry in range(36):
              try:
                  current=retrieve("data/gallery-index.json","?release="+str(retry))
                  if current==expected:
                      print("PUBLIC_GALLERY_INDEX_CURRENT")
                      break
              except Exception as exc: print("Live Pages gallery not yet ready",repr(exc))
              time.sleep(10)
          else: raise SystemExit("Public Pages gallery never matched current GitHub index")
          paths={"data/collection-index.json","data/gallery-index.json","data/collection-meta.json"}
          manifest_path=site/"data/reviewed-external-photo-manifest.json"
          published=json.loads(manifest_path.read_text()) if manifest_path.exists() else None
          if published: paths.add("data/reviewed-external-photo-manifest.json")
          external_count=0
          total=0;represented=0
          for row in catalog["entries"]:
              sid=row["id"]
              path="data/species/"+sid+".json"
              paths.add(path)
              card=json.loads((site/path).read_text())
              images=(published["species"].get(sid,[]) if published else card.get("verified_photos",[]))
              if len(images)!=row["photo_count"] or len(images)!=gal["entries"][sid]["count"]:
                  raise SystemExit("Gallery card and index disagree: "+sid)
              total+=len(images)
              represented+=bool(images)
              for x in images:
                  rel=x["src"]
                  is_commons_external=rel.startswith("https://upload.wikimedia.org/") or rel.startswith("https://commons.wikimedia.org/wiki/Special:Redirect/")
                  if not (rel.startswith("media/"+sid+"/") or is_commons_external) or rel in paths:raise SystemExit("Missing/bad image URL "+rel)
                  if not x.get("creator") or not x.get("source_page") or not x.get("license_url"):
                      raise SystemExit("Credit missing "+rel)
                  if x.get("private_rights_review_only"):raise SystemExit("Held photo exposed "+rel)
                  nc=x.get("license") in ("CC BY-NC 4.0","CC BY-NC-SA 4.0","OWNER PUBLIC DISPLAY PERMISSION")
                  if x.get("noncommercial_only") is not nc:raise SystemExit("NC usage flag mismatch "+rel)
                  if nc and meta.get("photo_license_policy",{}).get("noncommercial_educational_use") is not True:
                      raise SystemExit("Site does not qualify for NC "+rel)
                  if is_commons_external: external_count+=1
                  else: paths.add(rel)
          if total!=gal["photo_count"] or represented!=gal["photo_species"]:
              raise SystemExit("Published photo totals inconsistent")
          def verify(rel):
              source=(site/rel).read_bytes()
              live=retrieve(rel)
              if hashlib.sha256(source).digest()!=hashlib.sha256(live).digest():
                  raise ValueError("Live photo or species bytes differ from GitHub: "+rel)
              return rel
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              checked=list(pool.map(verify,sorted(paths)))
          print("LIVE_PUBLIC_GALLERY_IMAGE_PASS",json.dumps({
              "repository":meta["repository_full_name"],
              "site":base,"species":len(catalog["entries"]),
              "photos_indexed":total,"photographed_species":represented,
              "externally_linked_commons_photos_not_byte_checked":external_count,
              "exact_live_files_verified":len(checked)
          },sort_keys=True))
          PY
