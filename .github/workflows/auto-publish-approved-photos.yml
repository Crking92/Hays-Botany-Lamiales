name: Auto-publish approved Lamiales photos and regenerate photo manifest
on:
  push:
    branches: [staging/original-source-transfer]
    paths: ['photo-intake/approved/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: lamiales-family-auto-photo-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/original-source-transfer
          fetch-depth: 0
      - name: Isolate current public family website
        run: |
          git fetch origin main
          git worktree add "$RUNNER_TEMP/family-release" origin/main
      - name: Verify submitted photo rights, species ID and actual image bytes
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 "$RUNNER_TEMP/family-release/scripts/publish_approved_lamiales_photos.py" --source-root . --site-root "$RUNNER_TEMP/family-release/site" --check
      - name: Update actual website's reviewed photo manifest and previews
        run: python3 "$RUNNER_TEMP/family-release/scripts/publish_approved_lamiales_photos.py" --source-root . --site-root "$RUNNER_TEMP/family-release/site"
      - name: Validate all hosted image paths and credits
        working-directory: ${{ runner.temp }}/family-release
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path("site")
          j=json.loads((root/"data/reviewed-external-photo-manifest.json").read_text())
          idx=json.loads((root/"data/collection-index.json").read_text())["entries"]
          assert len(idx)==102
          assert set(j["species"]).issubset({x["id"] for x in idx})
          for sid,photos in j["species"].items():
              for p in photos:
                  assert p.get("creator") and p.get("source_page","").startswith("https://")
                  if p["src"].startswith("https://"):
                      continue
                  assert p["src"].startswith("media/"+sid+"/")
                  src=root/p["src"]
                  data=src.read_bytes()
                  assert hashlib.sha1(b"blob "+str(len(data)).encode()+b"\\0"+data).hexdigest()==p["source_blob_sha"]
          print("PASS: Lamiales originals, remote links and newly added hosted media")
          PY
      - name: Publish only family gallery assets
        working-directory: ${{ runner.temp }}/family-release
        id: release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/reviewed-external-photo-manifest.json site/data/gallery-index.json site/data/collection-index.json site/data/species/ site/media/
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Auto-publish source-checked Lamiales photographs"
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Request live GitHub Pages rebuild
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
