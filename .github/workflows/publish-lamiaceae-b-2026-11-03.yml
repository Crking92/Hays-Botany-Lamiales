name: Publish source-verified Lamiaceae batch B photos
on:
  push:
    branches: [main]
    paths:
      - 'photo-intake/remote-photo-manifests/lamiaceae-2026-11-03-b.json'
      - 'scripts/publish_verified_lamiaceae_zip.py'
      - '.github/workflows/publish-lamiaceae-b-2026-11-03.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: lamiales-lamiaceae-source-verified-waves-2026-11-03
  cancel-in-progress: false
jobs:
  release-cleared-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Install image validation dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Check live individual source, license, taxon, original photo SHA256 and photographer
        run: |
          python3 scripts/publish_verified_lamiaceae_zip.py \
            --manifest photo-intake/remote-photo-manifests/lamiaceae-2026-11-03-b.json \
            --source-root "$RUNNER_TEMP/source-cleared" \
            --report "$RUNNER_TEMP/lamiaceae-b-2026-11-03-source-audit.json"
      - name: Install approved photo originals with individual credits
        run: |
          if test -f site/data/reviewed-external-photo-manifest.json; then
            python3 scripts/publish_approved_lamiales_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site --check
            python3 scripts/publish_approved_lamiales_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site
          else
            python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site --check
            python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site
            python3 scripts/verify_automatic_gallery.py --site-root site
          fi
          python3 scripts/build_collection_preview.py
      - name: Commit and safely retry any concurrent family gallery updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/media site/data/species site/data/collection-index.json site/data/gallery-index.json
          if test -f site/data/reviewed-external-photo-manifest.json; then git add site/data/reviewed-external-photo-manifest.json; fi
          if git diff --cached --quiet; then
            echo "No new eligible photos. Sources already published or held."
          else
            git diff --cached --check
            git commit -m "Publish source-cleared Lamiaceae original photos"
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                echo "Photo originals and site records committed"
                break
              fi
              if test "$attempt" -eq 4; then
                echo "Could not push after four attempts" >&2
                exit 1
              fi
              git fetch origin main
              git reset --hard origin/main
              if test -f site/data/reviewed-external-photo-manifest.json; then
                python3 scripts/publish_approved_lamiales_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site --check
                python3 scripts/publish_approved_lamiales_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site
              else
                python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site --check
                python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site
                python3 scripts/verify_automatic_gallery.py --site-root site
              fi
              python3 scripts/build_collection_preview.py
              git add site/media site/data/species site/data/collection-index.json site/data/gallery-index.json
              if test -f site/data/reviewed-external-photo-manifest.json; then git add site/data/reviewed-external-photo-manifest.json; fi
              if git diff --cached --quiet; then
                echo "All eligible originals already present after concurrent updates"
                break
              fi
              git diff --cached --check
              git commit -m "Reapply source-cleared Lamiaceae.zip images onto latest family gallery"
            done
          fi
      - name: Preserve exact source-photo audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lamiaceae-b-2026-11-03-source-audit
          path: "${{ runner.temp }}/lamiaceae-b-2026-11-03-source-audit.json"
          retention-days: 30
          if-no-files-found: warn
