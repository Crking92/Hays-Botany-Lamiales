name: Repair Lamiales archive gallery and legacy photo manifest
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-lamiales-photo-manifest.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: hays-Hays-Botany-Lamiales-photo-publisher
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile only documented licensed species/gallery image records
        run: |
          python3 -m py_compile scripts/reconcile_legacy_photo_manifest.py
          python3 scripts/reconcile_legacy_photo_manifest.py
          python3 scripts/build_collection_preview.py
          git diff --check
      - name: Safely publish only complete verified gallery correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site/data/species site/data/reviewed-external-photo-manifest.json site/data/collection-index.json site/data/gallery-index.json site/media
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Already reconciled'
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo 'Another publisher changed main; no overwrite'
            exit 1
          fi
          git commit -m 'Reconcile credited Lamiales photo files and legacy verification manifest'
          git push origin HEAD:main
      - name: Request public Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
